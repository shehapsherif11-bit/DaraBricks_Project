<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#1b2130"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9884f"/>
      <stop offset="100%" stop-color="#9c6635"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dbe0"/>
      <stop offset="100%" stop-color="#a7adb8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cd6b"/>
      <stop offset="100%" stop-color="#d9a53a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>

  <text x="40" y="46" fill="#f4f6fa" font-size="24" font-weight="700">DaraBricks Lakehouse — Medallion Architecture</text>
  <text x="40" y="70" fill="#8b93a7" font-size="13">Databricks · PySpark · Delta Lake · Unity Catalog</text>

  <!-- Sources -->
  <g>
    <rect x="30" y="130" width="150" height="150" rx="10" fill="#232a3b" stroke="#3a4256"/>
    <text x="105" y="120" fill="#e7eaf2" font-size="13" font-weight="600" text-anchor="middle">Source Systems</text>
    <rect x="50" y="150" width="110" height="46" rx="6" fill="#2c3448"/>
    <text x="105" y="177" fill="#cfd4e0" font-size="13" text-anchor="middle">CRM (CSV)</text>
    <rect x="50" y="206" width="110" height="46" rx="6" fill="#2c3448"/>
    <text x="105" y="233" fill="#cfd4e0" font-size="13" text-anchor="middle">ERP (CSV)</text>
  </g>

  <line x1="182" y1="205" x2="228" y2="205" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <g>
    <rect x="232" y="100" width="230" height="360" rx="14" fill="url(#bronze)"/>
    <text x="347" y="135" fill="#3a2410" font-size="16" font-weight="700" text-anchor="middle">🥉 BRONZE</text>
    <text x="347" y="154" fill="#4a2f16" font-size="11" text-anchor="middle">Raw, as-is ingestion</text>
    <rect x="252" y="172" width="190" height="34" rx="6" fill="#7a5029" opacity="0.55"/>
    <text x="347" y="194" fill="#fff2e2" font-size="12" text-anchor="middle">cust_info · prd_info</text>
    <rect x="252" y="212" width="190" height="34" rx="6" fill="#7a5029" opacity="0.55"/>
    <text x="347" y="234" fill="#fff2e2" font-size="12" text-anchor="middle">sales_details</text>
    <rect x="252" y="252" width="190" height="34" rx="6" fill="#7a5029" opacity="0.55"/>
    <text x="347" y="274" fill="#fff2e2" font-size="12" text-anchor="middle">cust_az12 · loc_a101</text>
    <rect x="252" y="292" width="190" height="34" rx="6" fill="#7a5029" opacity="0.55"/>
    <text x="347" y="314" fill="#fff2e2" font-size="12" text-anchor="middle">px_cat_g1v2</text>
    <text x="347" y="352" fill="#3a2410" font-size="11" text-anchor="middle">Delta tables · workspace.bronze</text>
    <text x="347" y="370" fill="#3a2410" font-size="11" text-anchor="middle">no transformation applied</text>
  </g>

  <line x1="462" y1="280" x2="508" y2="280" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Silver -->
  <g>
    <rect x="512" y="60" width="230" height="440" rx="14" fill="url(#silver)"/>
    <text x="627" y="95" fill="#33363d" font-size="16" font-weight="700" text-anchor="middle">🥈 SILVER</text>
    <text x="627" y="114" fill="#4a4d55" font-size="11" text-anchor="middle">Cleansed &amp; standardized</text>
    <rect x="532" y="132" width="190" height="30" rx="6" fill="#8b93a0" opacity="0.5"/>
    <text x="627" y="152" fill="#22242a" font-size="11.5" text-anchor="middle">Trim, dedupe, type cast</text>
    <rect x="532" y="168" width="190" height="30" rx="6" fill="#8b93a0" opacity="0.5"/>
    <text x="627" y="188" fill="#22242a" font-size="11.5" text-anchor="middle">Code → label normalization</text>
    <rect x="532" y="204" width="190" height="30" rx="6" fill="#8b93a0" opacity="0.5"/>
    <text x="627" y="224" fill="#22242a" font-size="11.5" text-anchor="middle">Business rule fixes</text>
    <rect x="532" y="240" width="190" height="30" rx="6" fill="#8b93a0" opacity="0.5"/>
    <text x="627" y="260" fill="#22242a" font-size="11.5" text-anchor="middle">Column renaming</text>
    <line x1="547" y1="286" x2="707" y2="286" stroke="#6f7480" stroke-width="1"/>
    <text x="627" y="308" fill="#33363d" font-size="12" font-weight="600" text-anchor="middle">crm_customers · crm_products</text>
    <text x="627" y="328" fill="#33363d" font-size="12" font-weight="600" text-anchor="middle">crm_sales</text>
    <text x="627" y="348" fill="#33363d" font-size="12" font-weight="600" text-anchor="middle">erp_customer_location</text>
    <text x="627" y="368" fill="#33363d" font-size="12" font-weight="600" text-anchor="middle">erp_product_category</text>
    <text x="627" y="470" fill="#33363d" font-size="11" text-anchor="middle">Delta tables · workspace.silver</text>
  </g>

  <line x1="742" y1="280" x2="788" y2="280" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gold -->
  <g>
    <rect x="792" y="100" width="230" height="360" rx="14" fill="url(#gold)"/>
    <text x="907" y="135" fill="#4a3608" font-size="16" font-weight="700" text-anchor="middle">🥇 GOLD</text>
    <text x="907" y="154" fill="#5c4712" font-size="11" text-anchor="middle">Business-ready star schema</text>
    <rect x="812" y="180" width="190" height="40" rx="6" fill="#b9862a" opacity="0.55"/>
    <text x="907" y="202" fill="#3a2c07" font-size="12.5" font-weight="600" text-anchor="middle">dim_customers</text>
    <rect x="812" y="228" width="190" height="40" rx="6" fill="#b9862a" opacity="0.55"/>
    <text x="907" y="250" fill="#3a2c07" font-size="12.5" font-weight="600" text-anchor="middle">dim_products</text>
    <rect x="812" y="276" width="190" height="40" rx="6" fill="#c99d2e" opacity="0.75"/>
    <text x="907" y="298" fill="#3a2c07" font-size="12.5" font-weight="700" text-anchor="middle">fact_sales</text>
    <text x="907" y="342" fill="#4a3608" font-size="11" text-anchor="middle">Surrogate keys (xxhash64)</text>
    <text x="907" y="360" fill="#4a3608" font-size="11" text-anchor="middle">Delta tables · workspace.gold</text>
  </g>

  <line x1="1022" y1="280" x2="1068" y2="280" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consumption -->
  <g>
    <rect x="1072" y="215" width="98" height="130" rx="10" fill="#232a3b" stroke="#3a4256"/>
    <text x="1121" y="255" fill="#e7eaf2" font-size="12" text-anchor="middle">Power BI</text>
    <text x="1121" y="273" fill="#e7eaf2" font-size="12" text-anchor="middle">/ SQL</text>
    <text x="1121" y="291" fill="#e7eaf2" font-size="12" text-anchor="middle">Analytics</text>
  </g>

  <text x="40" y="595" fill="#5b6274" font-size="11">Bronze → Silver → Gold, all layers stored as Delta tables inside a Databricks Unity Catalog lakehouse.</text>
</svg>
